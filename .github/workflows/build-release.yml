name: 编译 .so（全版本）发布 Release

on:
  workflow_dispatch:

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      upload_url: ${{ steps.create_draft.outputs.upload_url }}
      release_id: ${{ steps.create_draft.outputs.release_id }}
      tag: ${{ steps.tag.outputs.tag }}
    permissions:
      contents: write
    steps:
      - name: 生成统一标签
        id: tag
        run: echo "tag=main.so-v${{ github.run_number }}" >> $GITHUB_OUTPUT

      - name: 彻底删除所有旧 Release 和标签
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          echo "开始清理历史 Release ..."
          # 分页获取所有 Release，最多 1000 个
          for page in $(seq 1 20); do
            data=$(curl -sS -H "Authorization: token $GH_TOKEN" \
              "https://api.github.com/repos/${{ github.repository }}/releases?per_page=100&page=$page")
            tags=$(echo "$data" | jq -r '.[].tag_name')
            [ -z "$tags" ] && break
            for t in $tags; do
              echo "删除 Release 及标签: $t"
              gh release delete "$t" --yes --cleanup-tag 2>/dev/null || true
            done
          done
          # 清理任何残留孤立 tag
          echo "清理孤立标签 ..."
          all_tags=$(curl -sS -H "Authorization: token $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/git/refs/tags" | \
            jq -r '.[].ref | sub("refs/tags/"; "")')
          for t in $all_tags; do
            if ! gh release view "$t" &>/dev/null; then
              echo "删除孤立标签: $t"
              curl -X DELETE -sS -H "Authorization: token $GH_TOKEN" \
                "https://api.github.com/repos/${{ github.repository }}/git/refs/tags/$t" || true
            fi
          done
          echo "清理完成！"

      - name: 创建 Draft Release
        id: create_draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          response=$(curl -sS -X POST \
            -H "Authorization: token $GH_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${{ github.repository }}/releases" \
            -d '{
              "tag_name": "${{ steps.tag.outputs.tag }}",
              "name": "main.so 全版本合集 | #${{ github.run_number }}",
              "body": "编译中，请稍候 ...",
              "draft": true,
              "prerelease": false
            }')
          upload_url=$(echo "$response" | jq -r '.upload_url')
          release_id=$(echo "$response" | jq -r '.id')
          echo "upload_url=$upload_url" >> $GITHUB_OUTPUT
          echo "release_id=$release_id" >> $GITHUB_OUTPUT
          echo "Draft Release 创建成功: ID=$release_id"

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - arch: amd64
            runner: ubuntu-22.04
          - arch: arm64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    permissions:
      actions: write
    steps:
      - name: 拉取私有仓库源码
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/scripts
          token: ${{ secrets.REPO_TOKEN }}
          path: .

      - name: 配置 Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 安装编译依赖
        run: |
          pip install --upgrade pip
          pip install cython setuptools wheel python-minifier
          pip install grpcio protobuf pyyaml psutil requests flask aiohttp

      - name: 混淆 main.py
        working-directory: agent-v1-so
        run: |
          pyminify --remove-literal-statements --remove-asserts --remove-debug --output main_obf.py main.py
          [ -s main_obf.py ] || { echo "混淆失败"; exit 1; }
          mv main_obf.py main.py

      - name: 编译为 .so
        working-directory: agent-v1-so
        run: |
          cat > setup.py << 'EOF'
          from setuptools import setup
          from Cython.Build import cythonize
          setup(
              name="monitor_worker",
              ext_modules=cythonize(
                  "main.py",
                  compiler_directives={'language_level': "3", 'always_allow_keywords': True},
                  annotate=False,
              ),
          )
          EOF
          python setup.py build_ext --inplace
          ls main*.so || { echo "未生成 .so"; exit 1; }

      - name: 重命名（含版本-架构）
        working-directory: agent-v1-so
        run: |
          mv $(ls main.cpython-*.so | head -1) main-${{ matrix.python-version }}-${{ matrix.arch }}.so
          ls -lh main-${{ matrix.python-version }}-${{ matrix.arch }}.so

      - name: 验证导入
        working-directory: agent-v1-so
        run: python -c "import main; print('✅ ${{ matrix.python-version }} ${{ matrix.arch }}')"

      - name: 直接上传到 Draft Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: agent-v1-so
        run: |
          # 从 prepare 获取 upload_url，并替换模板参数
          UPLOAD_URL="${{ needs.prepare.outputs.upload_url }}"
          # 去掉 {?name,label} 后缀，改为 ?name=文件名
          BASE_URL="${UPLOAD_URL%\{*}"
          FILE="main-${{ matrix.python-version }}-${{ matrix.arch }}.so"
          echo "上传 $FILE ..."
          curl -sS -X POST \
            -H "Authorization: token $GH_TOKEN" \
            -H "Content-Type: application/octet-stream" \
            --data-binary @"$FILE" \
            "$BASE_URL?name=$FILE"
          echo "上传完成"

  publish:
    needs: [prepare, build]
    if: success()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 发布 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "发布 Release ..."
          gh release edit "${{ needs.prepare.outputs.tag }}" --draft=false
          echo "发布完成"

      - name: 清理历史运行记录
        if: always()
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          delete_workflow_pattern: ${{ github.workflow }}
          retain_days: 0
          keep_minimum_runs: 3
