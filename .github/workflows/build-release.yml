name: 编译 .so（全版本）发布统一 Release

on:
  workflow_dispatch:

permissions:
  contents: write
  actions:  write

jobs:
# JOB 1 · prepare
  prepare:
    name: 清理历史 & 创建 Draft Release
    runs-on: ubuntu-latest
    outputs:
      upload_url: ${{ steps.create_draft.outputs.upload_url }}
      release_id: ${{ steps.create_draft.outputs.release_id }}
      tag:        ${{ steps.meta.outputs.tag }}

    steps:
      - name: 生成元数据
        id: meta
        run: |
          TAG="main.so-v${{ github.run_number }}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: 清理历史 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          REPO="${{ github.repository }}"

          KEEP_ID=$(gh api "repos/${REPO}/releases?per_page=10" \
            --jq '[.[] | select(.draft == false)] | .[0].id // empty')
          [[ -n "${KEEP_ID}" ]] && echo "保留 ID: ${KEEP_ID}" || echo "无已发布版本"

          PAGE=1
          while true; do
            ITEMS=$(gh api "repos/${REPO}/releases?per_page=100&page=${PAGE}" \
              --jq '.[] | "\(.id) \(.tag_name)"' 2>/dev/null || true)
            [[ -z "${ITEMS}" ]] && break
            while IFS=" " read -r ID TAG_NAME; do
              [[ "${ID}" == "${KEEP_ID}" ]] && { echo "跳过: ${TAG_NAME}"; continue; }
              echo "删除: ${TAG_NAME}"
              gh release delete "${TAG_NAME}" \
                --repo "${REPO}" --yes --cleanup-tag 2>/dev/null || true
            done <<< "${ITEMS}"
            (( PAGE++ ))
          done
          echo "✅ 清理完成"

      - name: 创建 Draft Release
        id: create_draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          REPO="${{ github.repository }}"
          TAG="${{ steps.meta.outputs.tag }}"

          PAYLOAD=$(jq -n \
            --arg tag  "${TAG}" \
            --arg name "main.so 全版本合集 | #${{ github.run_number }}" \
            --arg body "## main.so 全版本合集\n\n- Commit: \`${{ github.sha }}\`\n- 触发者: @${{ github.actor }}\n- 运行编号: #${{ github.run_number }}" \
            '{tag_name:$tag,name:$name,body:$body,draft:true,prerelease:false}')

          RESPONSE=$(gh api --method POST \
            --header "Accept: application/vnd.github.v3+json" \
            "repos/${REPO}/releases" --input - <<< "${PAYLOAD}")

          UPLOAD_URL=$(echo "${RESPONSE}" | jq -r '.upload_url')
          RELEASE_ID=$(echo "${RESPONSE}" | jq -r '.id')
          [[ -z "${UPLOAD_URL}" || "${UPLOAD_URL}" == "null" ]] \
            && { echo "${RESPONSE}"; exit 1; }

          echo "upload_url=${UPLOAD_URL}" >> "$GITHUB_OUTPUT"
          echo "release_id=${RELEASE_ID}" >> "$GITHUB_OUTPUT"
          echo "✅ Draft Release ID=${RELEASE_ID}"

# JOB 2 · build（glibc）
  build:
    name: glibc · py${{ matrix.python-version }} · ${{ matrix.arch }}
    needs: prepare
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
        arch:           [amd64, arm64]
        include:
          - { arch: amd64, runner: ubuntu-22.04 }
          - { arch: arm64, runner: ubuntu-22.04-arm }

    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/scripts
          token: ${{ secrets.REPO_TOKEN }}
          path: src

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-glibc-${{ matrix.python-version }}-${{ matrix.arch }}
          restore-keys: pip-glibc-${{ matrix.python-version }}-

      - name: 安装编译依赖
        run: |
          pip install --upgrade pip
          pip install cython setuptools wheel python-minifier \
                      grpcio protobuf pyyaml psutil requests flask aiohttp

      - name: 混淆 & 编译
        working-directory: src/agent-v1-so
        run: |
          pyminify --remove-literal-statements --remove-asserts --remove-debug \
            --output main_obf.py main.py
          [[ -s main_obf.py ]] || { echo "❌ 混淆失败"; exit 1; }
          mv main_obf.py main.py

          cat > setup.py << 'EOF'
          from setuptools import setup
          from Cython.Build import cythonize
          setup(name="monitor_worker", ext_modules=cythonize(
              "main.py",
              compiler_directives={"language_level":"3","always_allow_keywords":True},
              annotate=False,
          ))
          EOF
          python setup.py build_ext --inplace
          ls main*.so || { echo "❌ 未找到 .so"; exit 1; }

      - name: 重命名 & 验证
        id: artifact
        working-directory: src/agent-v1-so
        run: |
          SRC=$(ls main.cpython-*.so | head -1)
          DEST="main-${{ matrix.python-version }}-${{ matrix.arch }}.so"
          mv "${SRC}" "${DEST}"
          cp "${DEST}" "${{ github.workspace }}/artifact.so"
          echo "filename=${DEST}" >> "$GITHUB_OUTPUT"
          python -c "import main; print('✅ glibc ${{ matrix.python-version }} ${{ matrix.arch }}')"

      - name: 上传到 Draft Release
        env:
          GH_TOKEN:   ${{ secrets.GITHUB_TOKEN }}
          UPLOAD_URL: ${{ needs.prepare.outputs.upload_url }}
          FILENAME:   ${{ steps.artifact.outputs.filename }}
        run: |
          set -euo pipefail
          FILE="${{ github.workspace }}/artifact.so"
          [[ -s "${FILE}" ]] || { echo "❌ 产物为空"; exit 1; }
          BASE_URL="${UPLOAD_URL%\{*}"
          RESPONSE=$(curl -sS -w "\n%{http_code}" -X POST \
            -H "Authorization: token ${GH_TOKEN}" \
            -H "Content-Type: application/octet-stream" \
            --data-binary @"${FILE}" "${BASE_URL}?name=${FILENAME}")
          HTTP_CODE=$(echo "${RESPONSE}" | tail -n1)
          BODY=$(echo "${RESPONSE}" | sed '$d')
          echo "HTTP: ${HTTP_CODE}"
          if [[ "${HTTP_CODE}" != "201" ]]; then
            echo "❌ 上传失败: ${BODY}"
            gh release delete "${{ needs.prepare.outputs.tag }}" \
              --repo "${{ github.repository }}" --yes --cleanup-tag 2>/dev/null || true
            exit 1
          fi
          echo "✅ 上传成功"

# JOB 3 · build-musl（Alpine 容器）
  build-musl:
    name: musl · py${{ matrix.python-version }} · ${{ matrix.arch }}
    needs: prepare
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13"]
        arch:           [amd64, arm64]
        include:
          - { arch: amd64, runner: ubuntu-22.04 }
          - { arch: arm64, runner: ubuntu-22.04-arm }
        exclude:
          # grpcio 在 arm64+musl+py3.8 无预编译 wheel，源码编译耗时过长
          - { python-version: "3.8", arch: arm64 }

    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/scripts
          token: ${{ secrets.REPO_TOKEN }}
          path: src

      - name: 准备脚本
        run: |
          mkdir -p "${{ github.workspace }}/scripts" \
                   "${{ github.workspace }}/output"

          cat > "${{ github.workspace }}/scripts/build_musl.sh" << 'SCRIPT'
          #!/bin/sh
          set -ex

          echo "=== Python 版本 ==="
          python --version

          echo "=== 安装编译工具链 ==="
          apk add --no-cache gcc g++ musl-dev libffi-dev openssl-dev make

          echo "=== 升级 pip ==="
          pip install --upgrade pip --quiet

          echo "=== 安装 Cython 工具 ==="
          pip install --quiet cython setuptools wheel python-minifier

          echo "=== 安装运行时依赖 ==="
          pip install --prefer-binary --quiet \
            protobuf pyyaml psutil requests flask aiohttp

          echo "=== 安装 grpcio ==="
          GRPC_PYTHON_BUILD_SYSTEM_OPENSSL=1 \
          GRPC_PYTHON_BUILD_SYSTEM_ZLIB=1 \
          GRPC_PYTHON_DISABLE_LIBC_COMPATIBILITY=1 \
          pip install --prefer-binary grpcio

          echo "=== 混淆 main.py ==="
          pyminify \
            --remove-literal-statements --remove-asserts --remove-debug \
            --output main_obf.py main.py
          [ -s main_obf.py ] || { echo "❌ 混淆失败"; exit 1; }
          mv main_obf.py main.py

          echo "=== 生成 setup.py ==="
          cat > setup.py << 'SETUP_EOF'
          from setuptools import setup
          from Cython.Build import cythonize
          setup(name="monitor_worker", ext_modules=cythonize(
              "main.py",
              compiler_directives={"language_level":"3","always_allow_keywords":True},
              annotate=False,
          ))
          SETUP_EOF

          echo "=== 编译 .so ==="
          python setup.py build_ext --inplace 2>&1

          echo "=== 检查产物 ==="
          SO=$(ls main.cpython-*.so 2>/dev/null | head -1)
          [ -n "${SO}" ] || { echo "❌ 未找到 .so"; ls -la; exit 1; }
          echo "生成: ${SO}"
          ldd "${SO}" || true

          mv "${SO}" "/output/${OUTFILE}"
          ls -lh "/output/${OUTFILE}"
          echo "✅ 编译完成"
          SCRIPT

          chmod +x "${{ github.workspace }}/scripts/build_musl.sh"

          cat > "${{ github.workspace }}/scripts/validate_musl.py" << 'PYEOF'
          import importlib.util, os, sys
          so = os.environ["SO_NAME"]
          path = f"/out/{so}"
          if not os.path.exists(path):
              print(f"❌ 不存在: {path}", file=sys.stderr); sys.exit(1)
          if os.path.getsize(path) == 0:
              print(f"❌ 文件为空: {path}", file=sys.stderr); sys.exit(1)
          spec = importlib.util.spec_from_file_location("main", path)
          if spec is None:
              print(f"❌ 无法加载: {path}", file=sys.stderr); sys.exit(1)
          mod = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)
          print(f"✅ musl OK | WorkerApp={hasattr(mod,'WorkerApp')}")
          PYEOF

      - name: 编译 musl .so
        run: |
          set -euo pipefail
          PY_VER="${{ matrix.python-version }}"
          ARCH="${{ matrix.arch }}"
          OUTFILE="main-${PY_VER}-${ARCH}-musl.so"

          echo "▶ python:${PY_VER}-alpine 编译 ${OUTFILE}"
          docker run --rm \
            -v "${{ github.workspace }}/src/agent-v1-so:/work" \
            -v "${{ github.workspace }}/output:/output" \
            -v "${{ github.workspace }}/scripts:/scripts" \
            -e "OUTFILE=${OUTFILE}" \
            -w /work \
            "python:${PY_VER}-alpine" \
            sh /scripts/build_musl.sh

          ls -lh "${{ github.workspace }}/output/"
          [ -s "${{ github.workspace }}/output/${OUTFILE}" ] \
            || { echo "❌ 产物缺失"; exit 1; }

      - name: 验证导入
        run: |
          PY_VER="${{ matrix.python-version }}"
          ARCH="${{ matrix.arch }}"
          SO_NAME="main-${PY_VER}-${ARCH}-musl.so"

          docker run --rm \
            -v "${{ github.workspace }}/output:/out" \
            -v "${{ github.workspace }}/scripts:/scripts" \
            -e "SO_NAME=${SO_NAME}" \
            "python:${PY_VER}-alpine" \
            sh -c '
              set -e
              apk add --no-cache libstdc++ libgcc --quiet
              pip install --quiet --prefer-binary grpcio protobuf pyyaml psutil aiohttp
              python /scripts/validate_musl.py
            '

      - name: 上传到 Draft Release
        env:
          GH_TOKEN:   ${{ secrets.GITHUB_TOKEN }}
          UPLOAD_URL: ${{ needs.prepare.outputs.upload_url }}
        run: |
          set -euo pipefail
          PY_VER="${{ matrix.python-version }}"
          ARCH="${{ matrix.arch }}"
          BASENAME="main-${PY_VER}-${ARCH}-musl.so"
          FILE="${{ github.workspace }}/output/${BASENAME}"

          [[ -s "${FILE}" ]] || { echo "❌ 产物缺失"; exit 1; }
          BASE_URL="${UPLOAD_URL%\{*}"
          RESPONSE=$(curl -sS -w "\n%{http_code}" -X POST \
            -H "Authorization: token ${GH_TOKEN}" \
            -H "Content-Type: application/octet-stream" \
            --data-binary @"${FILE}" "${BASE_URL}?name=${BASENAME}")
          HTTP_CODE=$(echo "${RESPONSE}" | tail -n1)
          BODY=$(echo "${RESPONSE}" | sed '$d')
          echo "HTTP: ${HTTP_CODE}"
          if [[ "${HTTP_CODE}" != "201" ]]; then
            echo "❌ 上传失败: ${BODY}"
            gh release delete "${{ needs.prepare.outputs.tag }}" \
              --repo "${{ github.repository }}" --yes --cleanup-tag 2>/dev/null || true
            exit 1
          fi
          echo "✅ 上传成功"


# JOB 4 · cleanup-on-failure
  cleanup-on-failure:
    name: 失败时删除草稿
    needs: [prepare, build, build-musl]
    if: ${{ failure() }}
    runs-on: ubuntu-latest
    steps:
      - name: 删除草稿 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG:      ${{ needs.prepare.outputs.tag }}
        run: |
          [[ -z "${TAG}" || "${TAG}" == "null" ]] && exit 0
          gh release delete "${TAG}" \
            --repo "${{ github.repository }}" --yes --cleanup-tag 2>/dev/null || true
          echo "✅ 草稿已删除"

# JOB 5 · publish
  publish:
    name: 正式发布 Release
    needs: [prepare, build, build-musl]
    if: ${{ success() }}
    runs-on: ubuntu-latest
    steps:
      - name: Draft → Published
        env:
          GH_TOKEN:   ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
        run: |
          gh api --method PATCH \
            --header "Accept: application/vnd.github.v3+json" \
            "repos/${{ github.repository }}/releases/${RELEASE_ID}" \
            --field draft=false
          echo "✅ 发布完成"

      - name: 清理历史运行记录
        if: always()
        continue-on-error: true
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token:                   ${{ github.token }}
          repository:              ${{ github.repository }}
          delete_workflow_pattern: ${{ github.workflow }}
          retain_days:             0
          keep_minimum_runs:       3
