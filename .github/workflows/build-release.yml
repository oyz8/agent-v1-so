name: 编译 .so（多版本）并发布 Release
on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - arch: amd64
            runner: ubuntu-22.04
          - arch: arm64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    permissions:
      actions: write

    steps:
      - name: 拉取私有仓库源码
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/scripts
          token: ${{ secrets.REPO_TOKEN }}
          path: .

      - name: 配置 Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 安装编译依赖
        run: |
          pip install --upgrade pip
          pip install cython setuptools wheel python-minifier
          pip install grpcio protobuf pyyaml psutil requests flask aiohttp

      - name: 混淆 main.py
        working-directory: agent-v1-so
        run: |
          pyminify --remove-literal-statements --remove-asserts --remove-debug --output main_obf.py main.py
          [ -s main_obf.py ] || { echo "混淆失败"; exit 1; }
          mv main_obf.py main.py

      - name: 编译为 .so
        working-directory: agent-v1-so
        run: |
          cat > setup.py << 'EOF'
          from setuptools import setup
          from Cython.Build import cythonize
          setup(
              name="monitor_worker",
              ext_modules=cythonize(
                  "main.py",
                  compiler_directives={'language_level': "3", 'always_allow_keywords': True},
                  annotate=False,
              ),
          )
          EOF
          python setup.py build_ext --inplace
          ls main*.so || { echo "未生成 .so"; exit 1; }

      - name: 按架构重命名
        working-directory: agent-v1-so
        run: |
          mv $(ls main.cpython-*.so | head -1) main-${{ matrix.arch }}.so
          ls -lh main-${{ matrix.arch }}.so

      - name: 验证导入
        working-directory: agent-v1-so
        run: python -c "import main; print('✅ ${{ matrix.python-version }} ${{ matrix.arch }}')"

      - name: 上传 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: so-${{ matrix.python-version }}-${{ matrix.arch }}
          path: agent-v1-so/main-${{ matrix.arch }}.so
          retention-days: 1

  release:
    needs: build
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    permissions:
      contents: write

    steps:
      - name: 下载产物
        uses: actions/download-artifact@v4
        with:
          pattern: so-${{ matrix.python-version }}-*
          path: temp

      - name: 整理文件
        run: |
          mkdir dist
          cp temp/so-${{ matrix.python-version }}-amd64/main-amd64.so dist/
          cp temp/so-${{ matrix.python-version }}-arm64/main-arm64.so dist/

      - name: 生成标签
        id: tag
        run: echo "tag=main.so-py${{ matrix.python-version }}-${{ github.run_number }}" >> $GITHUB_OUTPUT

      - name: 删除同一 Python 版本的所有旧 Release 和标签
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PY_VER: ${{ matrix.python-version }}
          CURRENT_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          # 获取仓库所有标签
          all_tags=$(curl -sS -H "Authorization: token $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/git/refs/tags" | \
            jq -r '.[].ref' | sed 's|refs/tags/||' | grep "^main\.so-py${PY_VER}-")
          for tag in $all_tags; do
            if [ "$tag" != "$CURRENT_TAG" ]; then
              echo "清理旧 Release: $tag"
              # 删除 Release
              gh release delete "$tag" --yes 2>/dev/null || true
              # 删除标签
              curl -X DELETE -sS -H "Authorization: token $GH_TOKEN" \
                "https://api.github.com/repos/${{ github.repository }}/git/refs/tags/$tag" || true
            fi
          done

      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: "main.so | Python ${{ matrix.python-version }} | #${{ github.run_number }}"
          body: |
            ### 编译信息
            - Python 版本: ${{ matrix.python-version }}
            - 架构: amd64, arm64
            - 入口类: WorkerApp

            ### 使用
            1. 下载对应架构的 `main-xxx.so`，重命名为 `main.so`。
            2. 与 `config.yml` 同目录，运行 `python run.py`。
          files: |
            dist/main-amd64.so
            dist/main-arm64.so
          make_latest: false
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 清理历史运行记录
        if: always()
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          delete_workflow_pattern: ${{ github.workflow }}
          retain_days: 0
          keep_minimum_runs: 3
